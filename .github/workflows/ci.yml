name: Unified monorepo validation

on:
  push:
    branches: [main, "integration/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python CLI + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests
  frontend:
    name: Frontend profiles + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash ../scripts/install.sh
      - run: npm test
      - run: test -f dist/index.html
  metadata:
    name: Real GX end-to-end metadata/thumbnail contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/integration
